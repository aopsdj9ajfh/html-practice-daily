<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>HTML前后端体验</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="page">
        <h1>前后端数据体验</h1>

        <section class="card">
            <h2>后端文章列表</h2>
            <button id="load-btn">加载数据</button>
            <ul id="article-list"></ul>
            <p id="status"></p>
        </section>

        <section class="card">
            <h2>向后端提交留言</h2>
            <form id="message-form">
                <label>
                    姓名
                    <input id="name" name="name" placeholder="输入姓名"/>
                </label>
                <label>
                    内容
                    <input id="content" name="content" placeholder="输入留言"/>
                </label>
                <button type="submit">提交</button>
            </form>
            <p id="result"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
